<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo-Breaker AI Pop-Out</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      background-color: #0b0f19;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }
    h2 {
      font-size: 15px;
      margin: 0;
    }
    .status-card {
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      margin-right: 6px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);
      margin-bottom: 12px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .shortcut-info {
      font-size: 11px;
      color: #9ca3af;
      background: rgba(17, 24, 39, 0.8);
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #06b6d4;
      font-family: monospace;
      font-weight: bold;
    }
    .change-key-btn {
      background: transparent;
      border: 1px solid #06b6d4;
      color: #06b6d4;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" src="icons/icon48.png" alt="Echo-Breaker Logo">
    <div>
      <h2>Echo-Breaker AI</h2>
      <div style="font-size: 10px; color: #9ca3af;">Truth & Blind Spot Analyzer</div>
    </div>
  </div>

  <div class="status-card">
    <span>Backend Engine:</span>
    <span id="backendStatus"><span class="status-dot"></span>Checking...</span>
  </div>

  <button class="btn" id="openPopoutBtn">
    <span>🪟 Open Pop-Out Window</span>
  </button>

  <div class="shortcut-info">
    <div>Hotkey Shortcut: <span class="kbd" id="hotkeyDisplay">Alt+E</span></div>
    <button class="change-key-btn" id="changeHotkeyBtn">⚙️ Change Hotkey Shortcut</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
