<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo-Breaker AI Pop-Out</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      background-color: #0b0f19;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .header:hover .logo-svg {
      transform: scale(1.02);
    }
    h2 {
      font-size: 13px;
      margin: 0;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .status-card {
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      margin-right: 6px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);
      margin-bottom: 12px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .shortcut-info {
      font-size: 11px;
      color: #9ca3af;
      background: rgba(17, 24, 39, 0.8);
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #06b6d4;
      font-family: monospace;
      font-weight: bold;
    }
    .change-key-btn {
      background: transparent;
      border: 1px solid #06b6d4;
      color: #06b6d4;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="6" fill="#15171A" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.2"/>
      <path d="M8 9H17V11H10V14H16V16H10V19H17V21H8V9Z" fill="#FFFFFF"/>
      <path d="M18 9H22C23.6569 9 25 10.3431 25 12C25 13.1046 24.3 14.1 23.2 14.6C24.3 15.1 25 16.1 25 17.2C25 18.8569 23.6569 20.2 22 20.2H18V9ZM20 11V13.8H21.8C22.4627 13.8 23 13.2627 23 12.6C23 11.9373 22.4627 11.4 21.8 11.4H20ZM20 15.6V18.2H22C22.6627 18.2 23.2 17.6627 23.2 17C23.2 16.3373 22.6627 15.8 22 15.8H20Z" fill="#00F2FE"/>
    </svg>
    <div>
      <h2>ECHO-BREAKER</h2>
      <div style="font-size: 10px; color: #9ca3af;">Truth & Blind Spot Analyzer</div>
    </div>
  </div>

  <div class="status-card">
    <span>Backend Engine:</span>
    <span id="backendStatus"><span class="status-dot"></span>Checking...</span>
  </div>

  <button class="btn" id="openPopoutBtn">
    <span>🪟 Open Pop-Out Window</span>
  </button>

  <div class="shortcut-info">
    <div>Hotkey Shortcut: <span class="kbd" id="hotkeyDisplay">Alt+E</span></div>
    <button class="change-key-btn" id="changeHotkeyBtn">⚙️ Change Hotkey Shortcut</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
